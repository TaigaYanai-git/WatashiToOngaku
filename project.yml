name: WatashiToOngaku

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  WatashiToOngaku:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatashiToOngaku
        excludes:
          - AppIcon.icon
          - ThemeIcons
      # Icon Composer で作ったガラス風のアイコン（.icon はフォルダだが1つのファイルとして扱う）
      - path: WatashiToOngaku/AppIcon.icon
        type: file
        buildPhase: resources
      # テーマカラーに合わせた代替アイコン（設定でオンにしたときだけ切り替える）
      - path: WatashiToOngaku/ThemeIcons/AppIcon-White.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Rose.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Coral.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Sunset.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Lemon.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Mint.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Sky.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Lavender.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watashitoongaku
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-White AppIcon-Rose AppIcon-Coral AppIcon-Sunset AppIcon-Lemon AppIcon-Mint AppIcon-Sky AppIcon-Lavender"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WatashiToOngaku/WatashiToOngaku.entitlements
    info:
      path: WatashiToOngaku/Info.plist
      properties:
        CFBundleDisplayName: 私と音楽
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: 今日の一曲を選ぶために、Apple Music で曲を検索・試聴します。
        NSCameraUsageDescription: フレンドのQRコードを読み取るために使います。
        # 招待リンク（CloudKit の共有リンク）をこのアプリで開く
        CKSharingSupported: true
        REPO_URL: $(REPO_URL)
        PRIVACY_POLICY_URL: $(PRIVACY_POLICY_URL)

  WatashiToOngakuTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatashiToOngakuTests
    dependencies:
      - target: WatashiToOngaku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watashitoongaku.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WatashiToOngaku:
    build:
      targets:
        WatashiToOngaku: all
    run:
      config: Debug
    test:
      targets:
        - WatashiToOngakuTests
    archive:
      config: Release
