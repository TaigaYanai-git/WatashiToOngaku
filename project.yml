  WatashiToOngakuTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatashiToOngakuTests
    dependencies:
      - target: WatashiToOngaku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watashitoongaku.tests
        GENERATE_INFOPLIST_FILE: YES

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0

schemes:
  WatashiToOngaku:
    build:
      targets:
        WatashiToOngaku: all
    run:
      config: Debug
      # Xcode から実行したときは、App Store Connect の代わりにこのファイルの商品で購入を試せる
      storeKitConfiguration: Config/Plus.storekit
    test:
      targets:
        - WatashiToOngakuTests
    archive:
      config: Release
