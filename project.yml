name: WatashiToOngaku

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"

targets:
  WatashiToOngaku:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatashiToOngaku
        excludes:
          - AppIcon.icon
          - ThemeIcons
      # Icon Composer で作ったガラス風のアイコン（.icon はフォルダだが1つのファイルとして扱う）
      - path: WatashiToOngaku/AppIcon.icon
        type: file
        buildPhase: resources
      # 代替アイコン（scripts/make_icons.py で作る）。アプリ内のダークモードとテーマカラーに合わせて切り替える
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-White.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-White-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Rose.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Rose-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Coral.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Coral-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Sunset.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Sunset-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Lemon.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Lemon-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Mint.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Mint-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Sky.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Sky-Dark.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Lavender.icon
        type: file
        buildPhase: resources
      - path: WatashiToOngaku/ThemeIcons/AppIcon-Lavender-Dark.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watashitoongaku
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Dark AppIcon-White AppIcon-White-Dark AppIcon-Rose AppIcon-Rose-Dark AppIcon-Coral AppIcon-Coral-Dark AppIcon-Sunset AppIcon-Sunset-Dark AppIcon-Lemon AppIcon-Lemon-Dark AppIcon-Mint AppIcon-Mint-Dark AppIcon-Sky AppIcon-Sky-Dark AppIcon-Lavender AppIcon-Lavender-Dark"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WatashiToOngaku/WatashiToOngaku.entitlements
    info:
      path: WatashiToOngaku/Info.plist
      properties:
        CFBundleDisplayName: Our Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en, ko]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: 今日の一曲を選ぶために、Apple Music で曲を検索・試聴します。
        NSCameraUsageDescription: フレンドのQRコードを読み取るために使います。
        # 招待リンク（docs/add.html から watashitoongaku://add?c=コード で開く）
        CFBundleURLTypes:
          - CFBundleURLName: com.taigayanai.watashitoongaku.invite
            CFBundleURLSchemes: [watashitoongaku]
        PRIVACY_POLICY_URL: $(PRIVACY_POLICY_URL)
        # タイムラインの広告（AdMob）。Plus の人には出さない
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        AdMobNativeUnitID: $(ADMOB_NATIVE_UNIT_ID)
        NSUserTrackingUsageDescription: あなたに合った広告を表示するために使います。許可しなくても、アプリはこれまでどおり使えます。
        # Google が指定する SKAdNetwork の ID（広告の効果測定に使う）
